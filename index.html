<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다이어트 단백질 가성비 판독기</title>
    <meta name="description" content="단백질 1g당 가격을 산출하여 닭가슴살, 보충제 가성비를 비교합니다.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.2); }
        .receipt { background: #fff; border: 1px dashed #d1d5db; border-radius: 0.5rem; padding: 1.5rem; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .receipt::before, .receipt::after { content: ''; position: absolute; top: -10px; width: 20px; height: 20px; background: #f3f4f6; border-radius: 50%; }
        .receipt::before { left: -10px; } .receipt::after { right: -10px; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; transition: all 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">
    <!-- Header -->
    <div class="w-full max-w-2xl text-center mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-3 tracking-tight">다이어트 단백질 가성비 판독기</h1>
        <p class="text-gray-500 font-medium">단백질 1g당 가격을 산출하여 닭가슴살, 보충제 가성비를 비교합니다.</p>
    </div>

    <!-- Top AdSense -->
    <div class="w-full max-w-2xl mb-8 bg-white rounded-lg overflow-hidden shadow-sm flex items-center justify-center min-h-[100px]">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2228289204702106" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <!-- Main Logic Container -->
    <div class="w-full max-w-2xl glass-card p-6 md:p-8 mb-8">
        
<div class="flex flex-col gap-4">
    <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">제품 가격 (원)</label>
        <input type="number" id="pPrice" value="35000" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">총 용량 (서빙 수)</label>
            <input type="number" id="pServings" value="50" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">1서빙 단백질 (g)</label>
            <input type="number" id="pProtein" value="20" class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-blue-500">
        </div>
    </div>
    <button onclick="calcProtein()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">가성비 분석하기</button>
</div>
<div class="receipt mt-8">
    <h3 class="text-xl font-extrabold text-center mb-4">단백질 가성비 분석 결과</h3>
    <div class="flex justify-between border-b pb-2 mb-2 text-gray-600"><span>총 단백질량</span><span id="resTotalP">1,000 g</span></div>
    <div class="flex justify-between border-b pb-2 mb-2 text-gray-600"><span>1서빙 당 가격</span><span id="resPricePerS">700 원</span></div>
    <div class="flex justify-between pt-2 mt-4 text-blue-700 font-extrabold text-2xl bg-blue-50 p-4 rounded-lg"><span>순수 단백질 10g당</span><span id="resPricePer10g">350 원</span></div>
    <p id="pMsg" class="text-center font-bold text-gray-500 mt-3"></p>
</div>
<script>
function calcProtein() {
    let p = parseFloat(document.getElementById('pPrice').value)||0;
    let s = parseFloat(document.getElementById('pServings').value)||0;
    let pro = parseFloat(document.getElementById('pProtein').value)||0;
    let totalPro = s * pro;
    let perS = p / s;
    let per10g = (p / totalPro) * 10;
    document.getElementById('resTotalP').innerText = totalPro.toLocaleString() + " g";
    document.getElementById('resPricePerS').innerText = perS.toLocaleString(undefined, {maximumFractionDigits:0}) + " 원";
    document.getElementById('resPricePer10g').innerText = per10g.toLocaleString(undefined, {maximumFractionDigits:0}) + " 원";
    let msg = per10g < 300 ? "🔥 가성비 극강템! 무조건 사세요" : (per10g < 500 ? "👍 무난한 가성비입니다" : "💸 창렬입니다. 다시 생각해보세요");
    document.getElementById('pMsg').innerText = msg;
}
calcProtein();
</script>

    </div>

    <!-- Share & Ads -->
    <div class="w-full max-w-2xl flex flex-col gap-4 mb-10">
        <button onclick="shareApp()" class="w-full bg-[#fee500] text-[#191919] font-bold py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-[#f4dc00] transition shadow-sm">
            <i class="fas fa-share-nodes"></i> 카카오톡 및 SNS 공유하기
        </button>
        <a href="#" class="w-full bg-[#ff3131] text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-[#e62c2c] transition shadow-sm">
            <i class="fas fa-shopping-bag"></i> 쿠팡 특별 기획전 바로가기
        </a>
    </div>

    <!-- Bottom AdSense -->
    <div class="w-full max-w-2xl bg-white rounded-lg overflow-hidden shadow-sm flex items-center justify-center min-h-[100px]">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2228289204702106" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <script>
        function shareApp() {
            if (navigator.share) {
                navigator.share({ title: '다이어트 단백질 가성비 판독기', text: '단백질 1g당 가격을 산출하여 닭가슴살, 보충제 가성비를 비교합니다.', url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("링크가 복사되었습니다!");
            }
        }
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2228289204702106" crossorigin="anonymous"></script>
</body>
</html>
